<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layout Exercise 03 - CSS Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="css-layout-ex03-grid">
    <main>
      <h1>CSS Layout Exercise 03 - CSS Grid</h1>
      <section class="grid-container">
        <header class="grid-item item1 three_wide">Header</header>
        <div class="grid-item item2 four_tall two_wide">2</div>
        <div class="grid-item item3 four_tall">3</div>
        <div class="grid-item item4">4</div>
        <div class="grid-item item5">5</div>
        <div class="grid-item item7">7</div>
        <footer class="grid-item item8 three_wide">Footer</footer>
      </section>
    </main>
  </body>
</html>
